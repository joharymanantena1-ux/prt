<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Monogramme « jm. » — le wordmark de l'en-tête : plaque encre, point lime.
       Même dessin que apple-touch-icon.png / favicon.ico
       (scripts/generate-brand-assets.mjs). -->
  <rect width="64" height="64" rx="12" fill="#0e100f"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="'DM Sans', ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="600" letter-spacing="-3">
    <tspan fill="#efefec">jm</tspan><tspan fill="#d2f663">.</tspan>
  </text>
</svg>
