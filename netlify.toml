[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Functions live at /.netlify/functions/* — declared before the SPA catch-all
# so they are never rewritten to index.html.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
