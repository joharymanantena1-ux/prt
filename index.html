<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Thème appliqué avant le premier paint : source de vérité unique
         (localStorage), sombre par défaut comme :root dans index.css. Les deux
         attributs sont posés ici pour éviter tout flash au montage de React. -->
    <script>
      try {
        var light = localStorage.getItem("portfolio-theme") === "light";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (!light) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <link
      rel="preload"
      href="/fonts/dm-sans-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/portrait/johary-440.avif"
      imagesrcset="/portrait/johary-440.avif 440w, /portrait/johary-880.avif 880w"
      imagesizes="(max-width: 767px) 200px, (max-width: 1199px) 38vw, 460px"
      fetchpriority="high"
    />

    <!-- Icons — SVG first (crisp + theme-aware), .ico fallback, iOS touch icon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f2f2eb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e100f"
    />

    <title>Johary Manantena | Développeur Full-Stack</title>
    <meta
      name="description"
      content="Portfolio de Johary Manantena, développeur web full-stack (React, Node.js, TypeScript, Laravel, Spring Boot). Disponible pour missions freelance."
    />
    <meta name="author" content="Johary Manantena" />
    <meta
      name="keywords"
      content="développeur full-stack, React, Node.js, TypeScript, Laravel, Spring Boot, portfolio, freelance"
    />

    <meta
      property="og:title"
      content="Johary Manantena | Développeur Full-Stack"
    />
    <meta
      property="og:description"
      content="Applications web modernes et performantes — front, back et mobile."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Johary Manantena" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- canonical + og:url + og:image (URLs absolues) sont injectés au build par
         le plugin inject-site-meta (vite.config.ts) à partir de VITE_SITE_URL,
         ou automatiquement de la variable URL fournie par Netlify. -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Johary Manantena | Développeur Full-Stack"
    />
    <meta
      name="twitter:description"
      content="Applications web modernes et performantes — front, back et mobile."
    />

    <!-- Structured data — Person (référencement enrichi) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Johary Manantena",
        "jobTitle": "Développeur Full-Stack",
        "description": "Développeur web full-stack freelance — React, Node.js, TypeScript, Laravel, Spring Boot.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Antananarivo",
          "addressCountry": "MG"
        },
        "sameAs": [
          "https://github.com/joharymanantena1-ux",
          "https://www.linkedin.com/in/johary-andrianjafinoro-73b29b3a3"
        ],
        "knowsAbout": [
          "React",
          "React Native",
          "Node.js",
          "TypeScript",
          "Laravel",
          "Spring Boot",
          "GraphQL",
          "Shopify"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
