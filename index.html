<html lang="fr">

    <!-- Perf: preconnect to font origins before they are requested -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts loaded non-render-blocking (print→all swap), with display=swap fallback -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <title>Johary Manantena | Développeur Full-Stack</title>

      name="description"

    <!-- RGPD / CNIL — Google Consent Mode v2: analytics DENIED by default.
         The in-app cookie banner calls gtag('consent','update', …) on user opt-in. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-09ET3KDENS"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-09ET3KDENS', { anonymize_ip: true });
    </script>
